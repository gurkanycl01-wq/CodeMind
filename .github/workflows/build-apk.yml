name: Build CodeMind APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore codemind-release.jks \
            -alias codemind \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass codemind123 \
            -keypass codemind123 \
            -dname "CN=CodeMind, OU=CodeMind, O=CodeMind, L=Unknown, ST=Unknown, C=TR"

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Sign APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner bulunamadı."
            exit 1
          fi

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "Unsigned APK bulunamadı:"
            find app/build/outputs/apk -type f -print
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks codemind-release.jks \
            --ks-key-alias codemind \
            --ks-pass pass:codemind123 \
            --key-pass pass:codemind123 \
            --out app/build/outputs/apk/release/CodeMind.apk \
            "$APK"

      - name: Verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/CodeMind.apk

          test -f app/build/outputs/apk/release/CodeMind.apk

          echo "================================"
          echo "CodeMind APK hazır:"
          ls -lh app/build/outputs/apk/release/CodeMind.apk
          echo "================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeMind-release
          path: app/build/outputs/apk/release/CodeMind.apk
