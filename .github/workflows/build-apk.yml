name: Build CodeMind APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Check APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK bulunamadı."
            exit 1
          fi

          echo "APK bulundu: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeMind-release
          path: app/build/outputs/apk/release/*.apk
